services:
  grafana:
    user: root
    container_name: 'vericode-geomaplayers-panel'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.2.1}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
    volumes:
      - ../dist:/var/lib/grafana/plugins/vericode-geomaplayers-panel
      - ../provisioning:/etc/grafana/provisioning
      - ../public/ons-demo.geojson:/usr/share/grafana/public/maps/ons-demo.geojson:ro
      - ..:/root/grafana-geomap-layers

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.vericode-geomaplayers-panel:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: vericode-geomaplayers-panel
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/geomap-layers.json
